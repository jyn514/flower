## Generated by ci/generate_ci.clj ##
when:
  event: [push, pull_request]
steps:
- name: prepare
  image: clojure:temurin-25-tools-deps-alpine
  environment: {CLJ_CONFIG: cache/clj-config, GITLIBS: cache/gitlibs}
  commands: [rm -rf ~/.m2, mkdir -p cache/m2, ln -Tsf $(realpath cache/m2) ~/.m2, ci/install-clj.sh cache, '''clojure'' ''-J-Dclojure.main.report=stderr'' ''-P'' ''-M:test''', '''clojure'' ''-J-Dclojure.main.report=stderr'' ''-P'' ''-M:build''', git config --global --add safe.directory $(realpath .), '''clojure'' ''-J-Dclojure.main.report=stderr'' ''-T:build'' ''manifest'' '':include-untracked'' ''true''']
- name: unit
  image: clojure:temurin-25-tools-deps-alpine
  depends_on: [prepare]
  environment: {CLJ_CONFIG: cache/clj-config, GITLIBS: cache/gitlibs}
  commands: [rm -rf ~/.m2, mkdir -p cache/m2, ln -Tsf $(realpath cache/m2) ~/.m2, '''clojure'' ''-J-Dclojure.main.report=stderr'' ''-M:test'' ''--skip'' '':process''']
- name: integration
  image: ghcr.io/graalvm/native-image-community:25
  depends_on: [prepare]
  environment: {CLJ_CONFIG: cache/clj-config, GITLIBS: cache/gitlibs}
  commands: [rm -rf ~/.m2, mkdir -p cache/m2, ln -Tsf $(realpath cache/m2) ~/.m2, export LC_ALL=C.utf-8, microdnf install -y dnf dnf-plugins-core >/dev/null, dnf config-manager --enable ol10_codeready_builder, dnf install cmake gcc-c++ nodejs npm git python3-pygments --quiet, npm install -g --no-fund sass, git config --global --add safe.directory $(realpath .), ci/run-integration-tests.sh 'cache/bin/clojure' '-J-Dclojure.main.report=stderr']
